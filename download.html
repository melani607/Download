<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIO Media Downloader</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons (Untuk Icon Modern) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Konfigurasi Tema Tailwind (Opsional) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4f46e5', // Indigo 600
                        primaryHover: '#4338ca', // Indigo 700
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-primary text-white rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200">
                    <i class="ph ph-download-simple text-2xl"></i>
                </div>
                <h1 class="font-bold text-xl tracking-tight text-gray-900">
                    AIO<span class="text-primary">Downloader</span>
                </h1>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center py-10 px-4 sm:px-6">
        
        <!-- Hero Section -->
        <div class="w-full max-w-3xl text-center mb-10">
            <h2 class="text-3xl sm:text-4xl font-bold text-gray-900 mb-4 tracking-tight">
                Unduh Video & Audio
            </h2>
            <p class="text-gray-500 text-sm sm:text-base max-w-xl mx-auto">
                Masukkan tautan/URL di bawah ini untuk melihat pratinjau dan mengunduh konten.
            </p>
        </div>

        <!-- Input Box -->
        <div class="w-full max-w-2xl bg-white p-3 sm:p-4 rounded-2xl shadow-xl shadow-gray-200/50 border border-gray-100">
            <form id="downloadForm" class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-grow">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="ph ph-link text-gray-400 text-xl"></i>
                    </div>
                    <input 
                        type="url" 
                        id="urlInput" 
                        placeholder="Tempel tautan di sini..." 
                        required
                        class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-gray-700"
                    >
                </div>
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="bg-primary hover:bg-primaryHover text-white font-semibold py-3.5 px-8 rounded-xl transition-all shadow-lg shadow-indigo-200/50 flex items-center justify-center gap-2 shrink-0 disabled:opacity-70 disabled:cursor-not-allowed"
                >
                    <span id="btnText">Proses Link</span>
                    <i id="btnIcon" class="ph ph-arrow-right text-xl"></i>
                    <i id="loadingSpinner" class="ph ph-spinner animate-spin text-xl hidden"></i>
                </button>
            </form>
        </div>

        <!-- Error Box -->
        <div id="errorBox" class="w-full max-w-2xl mt-6 p-4 bg-red-50 border border-red-100 text-red-600 rounded-xl flex items-start gap-3 hidden">
            <i class="ph ph-warning-circle text-xl mt-0.5"></i>
            <div>
                <h4 class="font-semibold text-sm">Terjadi Kesalahan</h4>
                <p id="errorMessage" class="text-sm mt-1 opacity-90">Tidak dapat memproses tautan yang diberikan.</p>
            </div>
        </div>

        <!-- Result Area -->
        <div id="resultBox" class="w-full max-w-2xl mt-8 bg-white rounded-2xl shadow-xl shadow-gray-200/50 border border-gray-100 overflow-hidden hidden transition-all">
            
            <!-- Media Preview -->
            <div id="mediaPreviewContainer" class="w-full bg-gray-900 aspect-video relative flex items-center justify-center">
            </div>

            <!-- Content Details -->
            <div class="p-5 sm:p-7">
                <h3 id="resultTitle" class="text-lg sm:text-xl font-bold text-gray-900 line-clamp-2 mb-2"></h3>
                <p class="text-sm text-gray-500 mb-8 flex items-center gap-2 pb-4 border-b border-gray-100">
                    <i class="ph ph-check-circle text-green-500"></i> Media berhasil ditemukan
                </p>

                <!-- Kategori Unduhan -->
                <div class="space-y-8">
                    
                    <!-- Kategori Video -->
                    <div id="videoGroup" class="hidden">
                        <div class="flex items-center justify-between mb-4">
                            <h4 class="text-base font-bold text-gray-900 flex items-center gap-2">
                                <i class="ph ph-video-camera text-blue-600 text-xl"></i> Unduh Video
                            </h4>
                            <span class="text-xs font-medium text-gray-500 bg-gray-100 px-2.5 py-1 rounded-md">Pilihan Resolusi</span>
                        </div>
                        <div id="videoList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
                    </div>

                    <!-- Kategori Audio -->
                    <div id="audioGroup" class="hidden">
                        <div class="flex items-center justify-between mb-4">
                            <h4 class="text-base font-bold text-gray-900 flex items-center gap-2">
                                <i class="ph ph-headphones text-pink-600 text-xl"></i> Unduh Audio
                            </h4>
                            <span class="text-xs font-medium text-gray-500 bg-gray-100 px-2.5 py-1 rounded-md">Pilihan Resolusi</span>
                        </div>
                        <div id="audioList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
                    </div>

                </div>
            </div>
        </div>

    </main>

    <footer class="mt-auto py-6 text-center text-gray-400 text-sm">
        <p>&copy; 2026 AIO Downloader.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('downloadForm');
            const urlInput = document.getElementById('urlInput');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            const errorBox = document.getElementById('errorBox');
            const errorMessage = document.getElementById('errorMessage');
            
            const resultBox = document.getElementById('resultBox');
            const mediaPreviewContainer = document.getElementById('mediaPreviewContainer');
            const resultTitle = document.getElementById('resultTitle');
            
            const videoGroup = document.getElementById('videoGroup');
            const videoList = document.getElementById('videoList');
            const audioGroup = document.getElementById('audioGroup');
            const audioList = document.getElementById('audioList');

            const API_BASE_URL = 'https://andre-api-blue.vercel.app/api?endpoint=aio&url=';

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const url = urlInput.value.trim();
                if (!url) return;

                setLoadingState(true);
                hideError();
                hideResult();

                try {
                    const response = await fetch(`${API_BASE_URL}${encodeURIComponent(url)}`);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const data = await response.json();
                    const parsedData = parseApiResponse(data);
                    
                    if (!parsedData || parsedData.medias.length === 0) {
                        throw new Error('Tidak ada file media yang dapat ditemukan dari tautan ini.');
                    }

                    renderResult(parsedData);

                } catch (error) {
                    console.error('Fetch error:', error);
                    showError(error.message || 'Gagal memproses tautan. Pastikan API merespons atau tautan sudah benar.');
                } finally {
                    setLoadingState(false);
                }
            });

            function setLoadingState(isLoading) {
                if (isLoading) {
                    submitBtn.disabled = true;
                    btnText.textContent = 'Memproses...';
                    btnIcon.classList.add('hidden');
                    loadingSpinner.classList.remove('hidden');
                } else {
                    submitBtn.disabled = false;
                    btnText.textContent = 'Proses Link';
                    btnIcon.classList.remove('hidden');
                    loadingSpinner.classList.add('hidden');
                }
            }

            function showError(msg) {
                errorMessage.textContent = msg;
                errorBox.classList.remove('hidden');
            }

            function hideError() {
                errorBox.classList.add('hidden');
            }

            function hideResult() {
                resultBox.classList.add('hidden');
                mediaPreviewContainer.innerHTML = '';
                videoList.innerHTML = '';
                audioList.innerHTML = '';
                videoGroup.classList.add('hidden');
                audioGroup.classList.add('hidden');
            }

            function parseApiResponse(json) {
                let dataCore = json.data || json.result || json;
                let result = {
                    title: dataCore.title || "Media Berhasil Diambil",
                    thumbnail: dataCore.thumbnail || dataCore.thumb || dataCore.image || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop", 
                    medias: []
                };

                let items = dataCore.medias || dataCore.downloads || dataCore.urls || dataCore.video || [];

                if (items.length === 0 && dataCore.url) {
                    items = [{ url: dataCore.url, quality: "Default", extension: "mp4" }];
                } else if (!Array.isArray(items) && typeof items === 'object') {
                    if(items.mp4) result.medias.push({url: items.mp4, extension: 'mp4', quality: 'Video'});
                    if(items.mp3) result.medias.push({url: items.mp3, extension: 'mp3', quality: 'Audio'});
                    if(items.no_watermark) result.medias.push({url: items.no_watermark, extension: 'mp4', quality: 'No Watermark'});
                }

                if (Array.isArray(items)) {
                    result.medias = items.map(item => ({
                        url: item.url || item.link || item.download_url,
                        quality: item.quality || item.render || item.type || item.resolution || "Normal",
                        extension: item.extension || item.ext || item.format || "unknown"
                    })).filter(m => m.url);
                }

                return result;
            }

            function renderResult(data) {
                resultTitle.textContent = data.title;

                let previewMedia = null;
                const videoMedia = data.medias.find(m => m.extension.toLowerCase() !== 'mp3' && !m.quality.toLowerCase().includes('audio'));
                const audioMedia = data.medias.find(m => m.extension.toLowerCase() === 'mp3' || m.quality.toLowerCase().includes('audio'));

                if (videoMedia) {
                    previewMedia = { type: 'video', url: videoMedia.url, thumbnail: data.thumbnail };
                } else if (audioMedia) {
                    previewMedia = { type: 'audio', url: audioMedia.url, thumbnail: data.thumbnail };
                } else {
                    previewMedia = { type: 'image', url: data.thumbnail }; 
                }

                mediaPreviewContainer.innerHTML = '';
                if (previewMedia.type === 'video') {
                    mediaPreviewContainer.innerHTML = `
                        <video controls class="w-full h-full object-cover max-h-[400px]" poster="${previewMedia.thumbnail}" preload="metadata">
                            <source src="${previewMedia.url}" type="video/mp4">
                        </video>
                    `;
                } else if (previewMedia.type === 'audio') {
                    mediaPreviewContainer.innerHTML = `
                        <img src="${previewMedia.thumbnail}" alt="Thumbnail" class="w-full h-full object-cover max-h-[300px] opacity-70">
                        <div class="absolute bottom-4 left-4 right-4 bg-white/90 backdrop-blur-sm p-3 rounded-xl shadow-lg">
                            <audio controls class="w-full" src="${previewMedia.url}"></audio>
                        </div>
                    `;
                }

                // Memisahkan Array Media menjadi Video dan Audio
                const videos = data.medias.filter(m => m.extension.toLowerCase() !== 'mp3' && !m.quality.toLowerCase().includes('audio') && !m.extension.toLowerCase().includes('m4a'));
                const audios = data.medias.filter(m => m.extension.toLowerCase() === 'mp3' || m.extension.toLowerCase() === 'm4a' || m.quality.toLowerCase().includes('audio'));

                // Render Tombol Video
                if (videos.length > 0) {
                    videoGroup.classList.remove('hidden');
                    videos.forEach(media => {
                        videoList.insertAdjacentHTML('beforeend', createButton(media, 'video'));
                    });
                }

                // Render Tombol Audio
                if (audios.length > 0) {
                    audioGroup.classList.remove('hidden');
                    audios.forEach(media => {
                        audioList.insertAdjacentHTML('beforeend', createButton(media, 'audio'));
                    });
                }

                resultBox.classList.remove('hidden');
                setTimeout(() => resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
            }

            // Template Tombol Dinamis
            function createButton(media, type) {
                const isAudio = type === 'audio';
                const iconClass = isAudio ? 'ph-music-notes' : 'ph-monitor-play';
                const colorClass = isAudio ? 'text-pink-600 bg-pink-100' : 'text-blue-600 bg-blue-100';

                return `
                    <a href="${media.url}" target="_blank" rel="noopener noreferrer" 
                       class="flex items-center justify-between p-3 rounded-xl border border-gray-200 hover:border-primary/50 hover:bg-indigo-50/50 transition group">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0 ${colorClass}">
                                <i class="ph ${iconClass} text-xl"></i>
                            </div>
                            <div class="flex flex-col truncate">
                                <span class="font-medium text-gray-900 text-sm truncate">${media.quality}</span>
                                <span class="text-xs text-gray-500 uppercase tracking-widest">${media.extension}</span>
                            </div>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-gray-100 group-hover:bg-primary group-hover:text-white flex items-center justify-center transition-colors shrink-0">
                            <i class="ph ph-download-simple"></i>
                        </div>
                    </a>
                `;
            }
        });
    </script>
</body>
</html>
